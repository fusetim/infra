# Disable flannel to setup Cilium without Kube-proxy
# https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium#without-kube-proxy
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: true
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
    # Cilium and most ingress paths want a larger conntrack table and inotify
    # budget than the defaults give on a node running a few hundred pods.
    fs.inotify.max_user_instances: "8192"
    fs.inotify.max_user_watches: "1048576"
    net.core.rmem_max: "7500000"
    net.core.wmem_max: "7500000"
---
# Rest of the install is done via FluxCD