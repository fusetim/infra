apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: cilium
  interval: 10m
  path: ./k8s/clusters/oikos/infrastructure/envoy-gateway
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system