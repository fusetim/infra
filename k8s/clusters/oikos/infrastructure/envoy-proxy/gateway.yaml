apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gw
  namespace: default
spec:
  gatewayClassName: envoy
  allowedListeners:
    namespaces:
      from: Selector 
      selector:
        matchLabels:
          gateway-access: "edge-gw"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "edge-gw"
