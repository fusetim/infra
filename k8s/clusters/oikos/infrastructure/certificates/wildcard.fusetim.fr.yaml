apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard.fusetim.fr
  labels:
    use-cloudflare-solver: "true"
    letsencrypt: "staging"
spec:
  secretName: wildcard.fusetim.fr
  privateKey:
    algorithm: ECDSA
    size: 384
  duration: 1080h # 45d
  renewBefore: 360h # 15d
  isCA: false
  usages:
    - server auth
    - client auth
  subject:
    organizations:
      - FuseTim
  dnsNames:
    - '*.fusetim.fr'
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer