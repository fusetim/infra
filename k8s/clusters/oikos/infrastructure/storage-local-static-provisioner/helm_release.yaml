apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: storage-local-static-provisioner
  namespace: storage-local-static-provisioner
spec:
  interval: 1h
  chart:
    spec:
      chart: local-static-provisioner
      version: "2.10.0"
      sourceRef:
        kind: HelmRepository
        name: sig-storage-local-static-provisioner
        namespace: storage-local-static-provisioner
  targetNamespace: storage-local-static-provisioner
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    useJobForCleaning: true
    classes:
      - name: local-storage
        hostDir: /var/mnt/local-data/
        volumeMode: Filesystem
        accessMode: ReadWriteOnce
        storageClass: 
          isDefaultClass: true
        blockCleanerCommand:
          - "/scripts/quick_reset.sh"
    resources:
      limits:
        cpu: 100m
        memory: 200Mi
      requests:
        cpu: 50m
        memory: 100Mi