apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: k8s/clusters/oikos/infrastructure/cilium
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system