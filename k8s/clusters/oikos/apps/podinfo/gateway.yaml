apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: podinfo-gw
  namespace: podinfo
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-http
  namespace: podinfo
spec:
  parentRefs:
    - name: podinfo-gw
      namespace: podinfo
  hostnames:
    - "oikos.cloud.fusetim.fr"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          port: 9898
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
