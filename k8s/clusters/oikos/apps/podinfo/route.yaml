---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-http
  namespace: podinfo
spec:
  parentRefs:
    - name: edge-gw
      sectionName: https
      namespace: default
  hostnames:
    - "podinfo.oikos.cloud.fusetim.fr"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          port: 9898
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
